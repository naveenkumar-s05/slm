seed: 42
train_path: data/splits/train.jsonl
val_path: data/splits/val.jsonl
output_dir: models/cyberaware-qlora
logging_dir: experiments/logs
run_name: qwen2.5-1.5b-qlora-cyberaware

max_seq_length: 512
num_train_epochs: 2
max_steps: 160
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 0.0002
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 0.3

bf16: true
fp16: false
gradient_checkpointing: true
optim: paged_adamw_8bit
logging_steps: 10
eval_strategy: steps
eval_steps: 40
save_strategy: steps
save_steps: 40
save_total_limit: 2
report_to: none

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
